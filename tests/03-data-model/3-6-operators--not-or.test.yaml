# yaml-language-server: $schema=../../schema/spec-test.schema.json
title: "3.6 Operators (NOT_OR)"
description:
  "NOT_OR aggregation over its direct children. Leaf statuses come from `ruml:query` over the input
  datapoints: `yes` is `true`, `no` is `false`, `unknown` is `undefined`."
tests:
  - name: "operator-not-or--optimized--yes-yes-yes"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "All children are `true`, so the NOT_OR root is `false`. NOT_OR never short-circuits: every
      child is evaluated, even after a `true` one."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "optimized"
    inputs:
      dp_answer_1: "yes"
      dp_answer_2: "yes"
      dp_answer_3: "yes"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "false"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "true"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "true"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "true"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--complete--yes-yes-yes"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "Inputs yes/yes/yes in `complete` mode: every child is evaluated and the NOT_OR root is
      `false`."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "complete"
    inputs:
      dp_answer_1: "yes"
      dp_answer_2: "yes"
      dp_answer_3: "yes"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "false"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "true"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "true"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "true"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--optimized--no-yes-yes"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "The second child is `true`, so the NOT_OR root is `false`. NOT_OR never short-circuits: every
      child is evaluated, even after a `true` one."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "optimized"
    inputs:
      dp_answer_1: "no"
      dp_answer_2: "yes"
      dp_answer_3: "yes"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "false"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "false"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "true"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "true"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--complete--no-yes-yes"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "Inputs no/yes/yes in `complete` mode: every child is evaluated and the NOT_OR root is
      `false`."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "complete"
    inputs:
      dp_answer_1: "no"
      dp_answer_2: "yes"
      dp_answer_3: "yes"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "false"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "false"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "true"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "true"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--optimized--no-no-no"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "All three children are `false`, so the NOT_OR root is `true`. All children are checked."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "optimized"
    inputs:
      dp_answer_1: "no"
      dp_answer_2: "no"
      dp_answer_3: "no"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "true"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "false"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "false"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "false"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--complete--no-no-no"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "Inputs no/no/no in `complete` mode: every child is evaluated and the NOT_OR root is `true`."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "complete"
    inputs:
      dp_answer_1: "no"
      dp_answer_2: "no"
      dp_answer_3: "no"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "true"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "false"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "false"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "false"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--optimized--unknown-yes-no"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "A `true` child outranks the earlier `undefined` one, so the NOT_OR root is `false`. NOT_OR
      never short-circuits: every child is evaluated, even after a `true` one."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "optimized"
    inputs:
      dp_answer_1: "unknown"
      dp_answer_2: "yes"
      dp_answer_3: "no"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "false"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "undefined"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "true"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "false"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--complete--unknown-yes-no"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "Inputs unknown/yes/no in `complete` mode: every child is evaluated and the NOT_OR root is
      `false`."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "complete"
    inputs:
      dp_answer_1: "unknown"
      dp_answer_2: "yes"
      dp_answer_3: "no"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "false"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "undefined"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "true"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "false"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--optimized--no-yes-unknown"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "A `true` child outranks the later `undefined` one, so the NOT_OR root is `false`; the result
      does not depend on the order of the children."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "optimized"
    inputs:
      dp_answer_1: "no"
      dp_answer_2: "yes"
      dp_answer_3: "unknown"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "false"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "false"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "true"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "undefined"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--complete--no-yes-unknown"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "Inputs no/yes/unknown in `complete` mode: every child is evaluated and the NOT_OR root is
      `false`."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "complete"
    inputs:
      dp_answer_1: "no"
      dp_answer_2: "yes"
      dp_answer_3: "unknown"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "false"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "false"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "true"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "undefined"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--optimized--no-unknown-no"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "No child is `true` and one is `undefined`, so the NOT_OR root is `undefined`; checking
      continues past the `undefined` child."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "optimized"
    inputs:
      dp_answer_1: "no"
      dp_answer_2: "unknown"
      dp_answer_3: "no"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "undefined"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "false"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "undefined"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "false"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-or--complete--no-unknown-no"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "Inputs no/unknown/no in `complete` mode: every child is evaluated and the NOT_OR root is
      `undefined`."
    ruml: "3-6-operators.fixtures/evaluation-not-or-three-queried-children.ruml"
    run:
      mode: "complete"
    inputs:
      dp_answer_1: "no"
      dp_answer_2: "unknown"
      dp_answer_3: "no"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "undefined"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "false"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "undefined"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "false"
        comment: "Third child ('dp_answer_3')"
