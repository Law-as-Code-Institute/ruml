        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "false"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "true"
        comment: "Third child ('dp_answer_3')"
