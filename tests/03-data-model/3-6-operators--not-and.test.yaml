# yaml-language-server: $schema=../../schema/spec-test.schema.json
title: "3.6 Operators (NOT_AND)"
description:
  "NOT_AND aggregation over its direct children. Leaf statuses come from `ruml:query` over the input
  datapoints: `yes` is `true`, `no` is `false`, `unknown` is `undefined`."
tests:
  - name: "operator-not-and--optimized--yes-yes-yes"
    kind: "evaluation"
    spec:
      - "3.6"
    description: "All three children are `true`, so the NOT_AND root is `false`."
    ruml: "3-6-operators.fixtures/evaluation-not-and-three-queried-children.ruml"
    run:
      mode: "optimized"
    inputs:
      dp_answer_1: "yes"
      dp_answer_2: "yes"
      dp_answer_3: "yes"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "false"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "true"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "true"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "true"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-and--complete--yes-yes-yes"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "Inputs yes/yes/yes in `complete` mode: every child is evaluated and the NOT_AND root is
      `false`."
    ruml: "3-6-operators.fixtures/evaluation-not-and-three-queried-children.ruml"
    run:
      mode: "complete"
    inputs:
      dp_answer_1: "yes"
      dp_answer_2: "yes"
      dp_answer_3: "yes"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "false"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "true"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "true"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "true"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-and--optimized--no-no-no"
    kind: "evaluation"
    spec:
      - "3.6"
    description: "Inputs no/no/no in `optimized` mode: the NOT_AND root is `true`."
    ruml: "3-6-operators.fixtures/evaluation-not-and-three-queried-children.ruml"
    run:
      mode: "optimized"
    inputs:
      dp_answer_1: "no"
      dp_answer_2: "no"
      dp_answer_3: "no"
    assertions:
      - query: "evaluation.results.`1`.status"
        expectedValue: "true"
      - query: "evaluation.results.`1.1`.status"
        expectedValue: "false"
        comment: "First child ('dp_answer_1')"
      - query: "evaluation.results.`1.2`.status"
        expectedValue: "ignored"
        comment: "Second child ('dp_answer_2')"
      - query: "evaluation.results.`1.3`.status"
        expectedValue: "ignored"
        comment: "Third child ('dp_answer_3')"
  - name: "operator-not-and--complete--no-no-no"
    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "Inputs no/no/no in `complete` mode: the NOT_AND root is `true`. Unlike in `optimized` mode,
      the children after the first `false` one are evaluated too and receive their own status, not
      `ignored`."
    ruml: "3-6-operators.fixtures/evaluation-not-and-three-queried-children.ruml"
    run:
