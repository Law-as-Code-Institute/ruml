    spec:
      - "3.6"
    description: "Inputs no/unknown/yes in `optimized` mode: the NOT_AND root is `true`."
    ruml: "3-6-operators.fixtures/evaluation-not-and-three-queried-children.ruml"
    run:
      mode: "optimized"
    inputs:
