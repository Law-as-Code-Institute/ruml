      mode, the children after the first `false` one are evaluated too and receive their own status,
      not `ignored`."
    ruml: "3-6-operators.fixtures/evaluation-not-and-three-queried-children.ruml"
    run:
      mode: "complete"
    inputs:
      dp_answer_1: "no"
      dp_answer_2: "unknown"
