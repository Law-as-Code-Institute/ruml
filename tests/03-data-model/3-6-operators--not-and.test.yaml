    kind: "evaluation"
    spec:
      - "3.6"
    description:
      "NOT_AND stops at the first false child in `optimized` mode. The later children are never
      evaluated and receive status `ignored` — their input values go unused, which is not an error."
    ruml: "3-6-operators.fixtures/evaluation-not-and-three-queried-children.ruml"
    run:
      mode: "optimized"
    inputs:
      dp_answer_1: "no"
